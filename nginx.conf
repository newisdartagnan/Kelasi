server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Les supports de cours vont jusqu'à 20 Mo : nginx doit les laisser passer,
    # sinon le refus tombe avant même la validation applicative.
    client_max_body_size 24M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Alpine, embarqué dans Livewire, requiert 'unsafe-eval'. Sans cet en-tête
    # explicite, un proxy restrictif casse silencieusement tous les boutons.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Routes dynamiques Livewire : toujours par PHP, jamais en cache.
    location ^~ /livewire/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # L'export du classeur d'avancement peut prendre du temps sur une
        # université entière.
        fastcgi_read_timeout 300;
    }

    # Fichiers statiques réels uniquement : 404 si absent, jamais de repli PHP.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le service worker ne doit jamais être servi depuis le cache du
    # navigateur : c'est lui qui décide de la mise à jour de tout le reste.
    # Un sw.js périmé fige l'application sur une version ancienne.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Les supports de cours ne sont jamais servis en direct : ils passent par
    # la route qui vérifie le droit de lire.
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
